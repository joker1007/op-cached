[package]
name = "op-cached"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/joker1007/op-cached"
description = "GPG-encrypted in-memory cache daemon for 1Password CLI (op read / op inject)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
humantime = "2.4.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "process", "io-util", "macros", "time", "sync", "signal"] }
zeroize = "1.9.0"
